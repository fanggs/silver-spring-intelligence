<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        CivicLens — Fenton Village Community Intelligence
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header class="navbar">

        <a
            href="#home"
            class="brand"
        >
            Civic<span>Lens</span>
            <i>✦</i>
        </a>

        <p class="location">
            SILVER SPRING, MARYLAND
        </p>

        <nav class="nav-links">

            <a href="#explore">
                Explore
            </a>

            <a href="#about">
                About
            </a>

            <a href="#sources">
                Sources
            </a>

        </nav>

        <a
            href="#explore"
            class="nav-button"
        >
            Open CivicLens
            <span>↗</span>
        </a>

    </header>


    <main>

        <section
            class="hero"
            id="home"
        >

            <div class="hero-content">

                <p class="eyebrow">

                    COMMUNITY INTELLIGENCE

                    <span></span>

                    FENTON VILLAGE

                </p>

                <h1>
                    Know your

                    <em>
                        neighborhood.
                    </em>
                </h1>

                <p class="hero-description">
                    Public information about a place
                    should be easy to see, understand,
                    and verify.
                </p>

                <a
                    href="#explore"
                    class="hero-button"
                >
                    Explore Fenton Village

                    <span>↗</span>
                </a>

            </div>


            <div
                class="hero-visual"
                aria-hidden="true"
            >

                <div class="visual-grid"></div>

                <div class="circle circle-one"></div>

                <div class="circle circle-two"></div>

                <span class="point point-one"></span>

                <span class="point point-two"></span>

                <span class="point point-three"></span>

                <div class="location-card">

                    <p>
                        FENTON VILLAGE
                    </p>

                    <strong>
                        Silver Spring
                    </strong>

                    <span>
                        Maryland
                    </span>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
